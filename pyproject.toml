[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copuzzle"
version = "0.1.0.dev3"
description = "Abstract and physical goal-conditioned puzzles with offline trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "gymnasium>=1.0,<2"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "build>=1,<2"]
physics = ["mujoco>=3.2,<4"]
render = ["mujoco>=3.2,<4", "imageio>=2.31,<3"]

[project.scripts]
copuzzle = "copuzzle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copuzzle.games.lights_out.physics" = ["assets/ur5e/*", "assets/ur5e/assets/*.obj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
